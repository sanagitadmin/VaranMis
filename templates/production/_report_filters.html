<form class="filters report-filters" method="get" data-report-filters>
  <label><span>از تاریخ</span><input type="date" name="start" value="{{ start|date:'Y-m-d' }}"></label>
  <label><span>تا تاریخ</span><input type="date" name="end" value="{{ end|date:'Y-m-d' }}"></label>
  <label>
    <span>گروه محصول</span>
    <select name="group" data-filter-group>
      <option value="">همه گروه‌ها</option>
      {% for group in groups %}<option value="{{ group.id }}" {% if group_id == group.id %}selected{% endif %}>{{ group.name }}</option>{% endfor %}
    </select>
  </label>
  <label>
    <span>خط تولید</span>
    <select name="line" data-filter-line>
      <option value="">همه خطوط</option>
      {% for line in lines %}<option value="{{ line.id }}" data-group="{{ line.group_id }}" {% if line_id == line.id %}selected{% endif %}>{{ line.name }}</option>{% endfor %}
    </select>
  </label>
  <button class="button primary" type="submit">اعمال فیلتر</button>
  <div class="export-actions"><a class="button" href="{{ pdf_url }}?{{ filter_query }}">PDF</a><a class="button" href="{{ excel_url }}?{{ filter_query }}">Excel</a></div>
</form>
