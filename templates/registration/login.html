{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود به سامانه</title>
  <link rel="stylesheet" href="{% static 'production/styles.css' %}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand login-brand">
      <span class="brand-mark">V</span>
      <div>
        <strong>واران MIS</strong>
        <small>ورود کاربران تولید</small>
      </div>
    </div>
    {% if form.errors %}
      <div class="message error-message">نام کاربری یا رمز عبور صحیح نیست.</div>
    {% endif %}
    <form method="post" class="login-form">
      {% csrf_token %}
      <label>
        <span>نام کاربری</span>
        {{ form.username }}
      </label>
      <label>
        <span>رمز عبور</span>
        {{ form.password }}
      </label>
      <button class="button primary" type="submit">ورود</button>
    </form>
  </main>
</body>
</html>
