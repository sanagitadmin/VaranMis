name: Bug report
description: Report a defect in Varan MIS
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, URLs, dates, or report IDs.
  - type: textarea
    id: impact
    attributes:
      label: Business impact
  - type: textarea
    id: docs
    attributes:
      label: Documentation updates needed
      description: Which docs may need updates if this bug is fixed?
